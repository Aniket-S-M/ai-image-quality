services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-image-quality-backend

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: ai-image-quality-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  quality_data: